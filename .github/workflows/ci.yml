name: CI & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. JOB: Testen & Prüfen (Dein bestehender CI-Teil)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: uv installieren
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Python Version setzen
        run: uv python install 3.10

      - name: Abhängigkeiten installieren
        run: uv sync --dev

      - name: Linter & Formatter prüfen (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests ausführen (Pytest)
        run: uv run pytest tests/

  # 2. JOB: Versionierung (Dein Release-Teil)
  bump-version:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version bumpen und Tag erstellen
        id: tag_version   # <--- WICHTIG: Diese ID brauchen wir jetzt!
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: GitHub Release erstellen
        # Führe das nur aus, wenn wirklich ein neuer Tag erstellt wurde
        if: steps.tag_version.outputs.new_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Nutze die GitHub CLI, um das Release in der Seitenleiste zu erzeugen
        run: |
          gh release create ${{ steps.tag_version.outputs.new_tag }} \
            --title "Release ${{ steps.tag_version.outputs.new_tag }}" \
            --generate-notes
