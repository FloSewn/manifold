name: Release / Tagging

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Erlaubt dem Bot, Tags zu pushen

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # WICHTIG: Holt die ganze Historie, damit die alten Tags gefunden werden

      - name: Version bumpen und Tag erstellen
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch  # Falls kein Prefix passt, mach ein Fix (x.y.Z) draus
