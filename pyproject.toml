[project]
name = "manifold"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Florian Setzwein", email = "69447532+FloSewn@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.0.0",               # Colab hat 1.4.0
    "numpy>=2.1.0",                   # Colab hat 2.1.3
    "matplotlib>=3.10.0",             # Colab hat 3.10.0
    "opencv-python-headless>=4.11.0", # 4er oder 5er Versionen sind beide absolut fein
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E = pycodestyle, F = Pyflakes, I = isort
select = ["E", "F", "I"]


[tool.hatch.version]
source = "vcs"
