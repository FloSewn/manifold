[project]
name = "manifold"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Florian Setzwein", email = "69447532+FloSewn@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.4.0",
    "ipython>=9.17.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E = pycodestyle, F = Pyflakes, I = isort
select = ["E", "F", "I"]
